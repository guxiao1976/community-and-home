Name: auth.rpc
ListenOn: 0.0.0.0:8083
Timeout: 30000

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: auth.rpc

# 数据库 auth，见 docker-compose.yml
DataSource: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(localhost:3306)/auth?charset=utf8mb4&parseTime=true&loc=Local
Cache:
  - Host: localhost:6379

SysConfigRedis:
  Host: localhost:6379

JwtAuth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 900
  RefreshSecret: ${JWT_REFRESH_SECRET}
  RefreshExpire: 1296000

UserServiceRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

# AES 密钥从环境变量注入
AesKey: "${AES_KEY}"
# RSA 公钥（PEM 格式，非敏感，保留在 YAML 中）
