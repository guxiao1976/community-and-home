Name: perm-api
Host: 0.0.0.0
Port: 8883

# JWT 认证配置
Auth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 7200

# MySQL（供 auto-discover 等管理功能使用）
DataSource: ${MYSQL_DATA_SOURCE}
AesKey: ${AES_KEY}

# 权限中心 gRPC 客户端（通过 etcd 发现）
PermissionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: permission.rpc
