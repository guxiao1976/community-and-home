Name: community-hub.rpc
# 安全：数据权限身份经 gRPC metadata 传输（scope.UserIDFromCtx），RPC 必须绑定回环，
# 仅信任宿主机上的调用方（API 网关 / moderation-service 回调），阻断局域网与 Docker 桥接网络对端
# 伪造 user_id 注入身份（评审 CRITICAL：RPC 数据权限安全前提 = 网络隔离）。等所有服务统一 mTLS 前，
# 此回环绑定 + 文档化是 fail-closed 的落地手段。
ListenOn: 127.0.0.1:8088
Timeout: 30000

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: community-hub.rpc

# 数据库 community_hub_db，见 docker-compose.yml
DataSource: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(localhost:3306)/community_hub_db?charset=utf8mb4&parseTime=true&loc=Local

# gRPC fallback for sysconfig cache-miss: calls master-data GetConfig
MasterDataRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: masterdata.rpc

SysConfigRedis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASSWORD}"

ModerationRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: moderation.rpc

ModerationRedis:
  Host: localhost:6379
  Pass: "${REDIS_PASSWORD}"

# permission-service gRPC 客户端（数据权限：AssertPublishScope / GetDataScopes / GetUserRoles）
PermissionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: permission.rpc

# user-service gRPC 客户端（publisher 展示名真实档案查询 GetUsersByIds，R5）
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc

# file-service gRPC 客户端（附件绑定/重生 GetFileUrl，REQ-CPB-6）
FileRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: file.rpc

# Kafka 生产者（content-review topic，Task 1.17/1.18）
# brokers 用 EXTERNAL listener（localhost:29092）：community-hub 为宿主机进程，
# 不在 compose 网络内，kafka:9092 无法解析；29092 为宿主机可达映射端口（docker-compose）。
Kafka:
  Brokers:
    - localhost:29092
  Topic: content-review
  RetryIntervalSeconds: 60
