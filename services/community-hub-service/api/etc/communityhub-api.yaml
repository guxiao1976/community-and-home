Name: community-hub-api
Host: 0.0.0.0
Port: 8887
Timeout: 30000

Auth:
  AccessSecret: ${JWT_ACCESS_SECRET}
  AccessExpire: 7200

# community-hub-service gRPC 客户端（etcd 发现）
CommunityHubRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: community-hub.rpc

# permission-service gRPC 客户端（RBAC 鉴权）
PermissionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: permission.rpc

# 仅 REST 详情 community_id 兼容回退用（contentcompat 只读查询，R2）
DataSource: ${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(localhost:3306)/community_hub_db?charset=utf8mb4&parseTime=true&loc=Local
