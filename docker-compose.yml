version: "3.8"

name: middleware-stack
networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24

# ============================================================
# 共享环境变量（定义一次，所有服务引用）
# 值来自项目根目录 .env 文件
# 注意：RSA 密钥保留在服务 YAML 配置中（PEM 多行文本）
# ============================================================
x-common-env: &common-env
  AES_KEY: ${AES_KEY}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

services:
  # ==================== MySQL 8.0 ====================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    networks: 
      app-network:
        ipv4_address: 172.19.0.2
    ports: ["3306:3306"]
    # 本地目录挂载：当前目录 mysql-data → 容器数据目录
    volumes:
      - ./data/mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: default_db
      TZ: Asia/Shanghai
    command: --lower_case_table_names=1 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect='SET NAMES utf8mb4' --skip-character-set-client-handshake
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== etcd ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - ./data/etcd-data:/etcd-data
    networks:
      app-network:
        ipv4_address: 172.19.0.3
    command: [
      "/usr/local/bin/etcd",
      "--name=etcd-node-1",
      "--data-dir=/etcd-data",
      "--advertise-client-urls=http://0.0.0.0:2379",
      "--listen-client-urls=http://0.0.0.0:2379",
      "--listen-peer-urls=http://0.0.0.0:2380",
      "--initial-advertise-peer-urls=http://0.0.0.0:2380",
      "--initial-cluster=etcd-node-1=http://0.0.0.0:2380",
      "--initial-cluster-token=etcd-cluster-1",
      "--initial-cluster-state=new"
    ]
  # ==================== Redis 7.0 ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    networks: 
      app-network:
        ipv4_address: 172.19.0.4
    ports: ["6379:6379"]
    volumes:
      - ./data/redis-data-new:/data
    command: redis-server --appendonly yes
    environment:
      TZ: Asia/Shanghai

  # ==================== APISIX ====================
  apisix:
    image: apache/apisix:latest
    container_name: apisix
    restart: always
    networks:
      app-network:
        ipv4_address: 172.19.0.5
    ports: ["9080:9080", "9090:9090", "9180:9180", "9443:9443"]
    depends_on:
      etcd:
        condition: service_started
    volumes:
      - ./api-proto/gen/descriptor:/opt/proto-descriptor:ro
    environment:
      TZ: Asia/Shanghai
      APISIX_DEPLOYMENT_ETCD_HOST: "[\"http://etcd:2379\"]"

  # ==================== MinIO ====================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    networks: 
      app-network:
        ipv4_address: 172.19.0.6
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio-data:/data
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minio123456
    command: server /data --console-address ":9001"

  # ==================== Neo4j 5 ====================
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    networks:
      app-network:
        ipv4_address: 172.19.0.7
    ports:
      - "7474:7474"   # HTTP / Neo4j Browser
      - "7687:7687"   # Bolt protocol（应用程序连接）
    volumes:
      - ./data/neo4j-data:/data                                    # 数据持久化
      - ./data/neo4j-logs:/logs                                    # 日志
      - ./data/neo4j-import:/var/lib/neo4j/import                  # 批量导入
    environment:
      TZ: Asia/Shanghai
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j123456}"          # 从 .env 读取，本地开发有默认值
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # 允许 APOC 过程（后续批量导入可能用到）
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==================== Kafka 3.7（单节点 KRaft，content-review topic）====================
  # 通用图文发布（content-post-generalization）内容级审核链路：community-hub 生产者推送
  # content-review 消息（at-least-once 待推标记 + 定时重推），moderation 消费者后期开发。
  # KRaft 单节点（无 ZooKeeper）：process.roles=broker,controller。
  # 镜像选用 apache/kafka:3.7.0（任务允许「或等位 KRaft 单节点镜像」；本地镜像源无 bitnami/kafka）。
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: always
    networks:
      app-network:
        ipv4_address: 172.19.0.8
    ports:
      - "9092:9092"          # INTERNAL：compose 网络内（kafka:9092）
      - "29092:29092"        # EXTERNAL：宿主机可达（localhost:29092，community-hub 宿主机进程使用）
    volumes:
      - ./data/kafka-data:/var/lib/kafka/data                        # 数据持久化（appuser 拥有）
    environment:
      TZ: Asia/Shanghai
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"   # 双通告：网络内 kafka:9092 / 宿主 localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"                       # 仅显式 topic，禁自动创建
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"                    # 单节点必需=1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    # content-review topic：partition=1 / replication=1；retention 覆盖消费者上线空窗
    # （本期无消费者，消息须存活到消费者存在或 pending-push 重推补投）。
    # apache/kafka 镜像无 KAFKA_CREATE_TOPICS，故命令覆盖：启动 broker → 等就绪 → 建 topic。
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /etc/kafka/docker/run &
        BROKER_PID=$$!
        BIN=/opt/kafka/bin
        ready=0
        for i in $$(seq 1 60); do
          if ! kill -0 "$$BROKER_PID" 2>/dev/null; then
            echo "kafka broker exited prematurely" >&2
            wait "$$BROKER_PID"; exit $$?
          fi
          if $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
            ready=1; break
          fi
          sleep 2
        done
        if [ "$$ready" -ne 1 ]; then
          echo "kafka broker not ready in 120s" >&2; exit 1
        fi
        echo "===> Broker ready — creating content-review topic"
        $$BIN/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
          --topic content-review --partitions 1 --replication-factor 1
        echo "===> content-review topic ready"
        wait "$$BROKER_PID"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
