name: Frontend CI

# 职责：前端质量保障
# - 运行单元测试（vitest）
# - 类型检查（vue-tsc）
# - 构建验证（vite build）
# - 覆盖 web/pc（管理后台）和 web/mobile（移动端）

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'web/**'

jobs:
  pc-frontend:
    name: PC Frontend (Admin Dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/pc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/pc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan dependencies with Trivy (npm vuln audit)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-dist
          path: web/pc/dist
          retention-days: 7

  mobile-frontend:
    name: Mobile Frontend (UniApp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Scan dependencies with Trivy (npm vuln audit)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Build H5
        run: npm run build:h5

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dist-h5
          path: web/mobile/dist/build/h5
          retention-days: 7

  summary:
    name: Frontend CI Summary
    runs-on: ubuntu-latest
    needs: [pc-frontend, mobile-frontend]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Frontend CI Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "PC Frontend: ${{ needs.pc-frontend.result }}"
          echo "Mobile Frontend: ${{ needs.mobile-frontend.result }}"
          echo ""

          if [[ "${{ needs.pc-frontend.result }}" != "success" ]] || [[ "${{ needs.mobile-frontend.result }}" != "success" ]]; then
            echo "❌ Some frontend checks failed"
            exit 1
          fi

          echo "✅ All frontend checks passed"
