name: Go Tests and Coverage

# 职责：基础质量保障
# - 运行所有 logic 包的单元测试
# - 检查测试覆盖率（30% 门禁）
# - 运行 golangci-lint 静态分析
# - 验证 logic 文件有对应测试
# - 上传覆盖率报告到 Codecov
#
# 与 harness-qa-check.yml 的区别：
# - test.yml: 基础测试 + 覆盖率 + lint（快速反馈）
# - harness-qa-check.yml: 15 项机械化检查（深度验证）

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: |
        go mod download
        go install github.com/golang/mock/mockgen@latest

    - name: Run tests
      run: |
        go test ./services/*/api/internal/logic/... \
          ./services/*/rpc/internal/logic/... \
          -v -cover -coverprofile=coverage.out

    - name: Check coverage
      run: |
        echo "=== Coverage Report ==="
        go tool cover -func=coverage.out

        # 提取总覆盖率
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"

        # 检查是否达到目标
        THRESHOLD=30
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
          exit 1
        fi

        echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage HTML
      run: go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for test files
      run: |
        echo "=== Checking for test files ==="

        # 查找所有 *_logic.go 文件
        LOGIC_FILES=$(find services -name "*_logic.go" -not -path "*/mocks/*" || true)

        if [[ -z "$LOGIC_FILES" ]]; then
          echo "ℹ️  No logic files found"
          exit 0
        fi

        MISSING_TESTS=()

        for file in $LOGIC_FILES; do
          test_file="${file%_logic.go}_logic_test.go"
          if [[ ! -f "$test_file" ]]; then
            MISSING_TESTS+=("$file")
          fi
        done

        if [[ ${#MISSING_TESTS[@]} -gt 0 ]]; then
          echo "❌ The following logic files are missing tests:"
          for file in "${MISSING_TESTS[@]}"; do
            echo "  - $file"
          done
          exit 1
        fi

        echo "✅ All logic files have corresponding tests"

    - name: Quality gate passed
      run: echo "✅ All quality checks passed"
