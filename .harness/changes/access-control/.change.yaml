clarifications:
  - id: CLAR-1
    scope: platform-restriction
    question: "RefreshTokenRequest 现无 device_type，刷新时如何识别端"
    decision: "a — RefreshTokenRequest 增 device_type"
  - id: CLAR-2
    scope: current-community
    question: "user_app_state.current_community_id 与 preferences.default_community_id 的关系"
    decision: "a — app_state 取代 preferences（开发阶段无存量数据，无需迁移；preferences 字段去留阶段3定）"
  - id: CLAR-3
    scope: section-quota
    question: "配额适用板块清单（notices/contacts 是否计数、管理员是否计入）"
    decision: "c — 以 sys_section_quota 配置为权威，配置了限制、未配置不限；管理员/官方发布默认不配置"
  - id: CLAR-4
    scope: member-constraint, same-house-visibility
    question: "房屋「楼/单元/房号」采集时点（现 user_residence 仅认证后创建）"
    decision: "a+c — JoinCommunity 即采集楼/单元/房号，membership 增 building/unit/room 三列"
stage3_open:
  - id: STAGE3-1
    scope: member-constraint
    question: "「认证用户不受每年次数限制」的认证粒度：全局（任一小区已认证）vs per-community（目标小区认证）"
  - id: STAGE3-2
    scope: section-quota
    question: "占配额唯一计数谓词与 design §7 公式矛盾（待审内容 status 非 active 会被公式排除）——tasks.md 需记录「阶段3 修正 design §7 计数公式」"
  - id: STAGE3-3
    scope: 全部
    question: "错误码命名空间对齐（050006/80007/10014 与各服务现状 6 位码；10006 语义冲突）"
